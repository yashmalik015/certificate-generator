<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Text path on inner circumference -->
    <path id="textArcTop" d="M 92,300 A 208,208 0 1,1 508,300" fill="none" />
    <path id="textArcFull" d="M 96,300 A 204,204 0 1,1 504,300 A 204,204 0 0,1 96,300" fill="none" />
    
    <!-- Shadow for central disc -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Leaves / Laurel Wreath (Left & Right) -->
  <g fill="#00a651" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- LEFT LAUREL LEAVES -->
    <!-- Leaf 1 (Top Left) -->
    <path d="M 235,42 C 185,65 160,118 178,162 C 152,122 158,80 182,50 Z" />
    <path d="M 175,90 C 130,122 115,180 138,228 C 112,185 118,138 142,105 Z" />
    <path d="M 132,158 C 88,198 78,260 105,310 C 80,265 85,215 110,178 Z" />
    <path d="M 95,240 C 55,285 50,350 80,402 C 55,355 60,300 85,262 Z" />
    <path d="M 72,328 C 42,378 45,445 82,492 C 58,445 60,390 82,352 Z" />
    <path d="M 75,418 C 65,470 85,528 138,555 C 98,525 90,475 102,438 Z" />
    <path d="M 125,488 C 138,528 175,555 228,560 C 182,548 155,525 145,500 Z" />
    
    <!-- Left Inner Leaves -->
    <path d="M 225,98 C 190,132 182,175 200,210 C 178,172 178,135 198,110 Z" />
    <path d="M 180,165 C 145,205 140,252 160,290 C 135,250 135,210 155,180 Z" />
    <path d="M 145,245 C 115,290 110,340 132,380 C 108,340 108,295 128,262 Z" />
    <path d="M 122,330 C 98,378 98,430 125,465 C 98,425 98,380 115,350 Z" />
    <path d="M 118,405 C 108,452 128,498 172,522 C 138,495 130,455 138,422 Z" />

    <!-- RIGHT LAUREL LEAVES -->
    <!-- Leaf 1 (Top Right) -->
    <path d="M 365,42 C 415,65 440,118 422,162 C 448,122 442,80 418,50 Z" />
    <path d="M 425,90 C 470,122 485,180 462,228 C 488,185 482,138 458,105 Z" />
    <path d="M 468,158 C 512,198 522,260 495,310 C 520,265 515,215 490,178 Z" />
    <path d="M 505,240 C 545,285 550,350 520,402 C 545,355 540,300 515,262 Z" />
    <path d="M 528,328 C 558,378 555,445 518,492 C 542,445 540,390 518,352 Z" />
    <path d="M 525,418 C 535,470 515,528 462,555 C 502,525 510,475 498,438 Z" />
    <path d="M 475,488 C 462,528 425,555 372,560 C 418,548 445,525 455,500 Z" />
    
    <!-- Right Inner Leaves -->
    <path d="M 375,98 C 410,132 418,175 400,210 C 422,172 422,135 402,110 Z" />
    <path d="M 420,165 C 455,205 460,252 440,290 C 465,250 465,210 445,180 Z" />
    <path d="M 455,245 C 485,290 490,340 468,380 C 492,340 492,295 472,262 Z" />
    <path d="M 478,330 C 502,378 502,430 475,465 C 502,425 502,380 485,350 Z" />
    <path d="M 482,405 C 492,452 472,498 428,522 C 462,495 470,455 462,422 Z" />

    <!-- Bottom Center Tied Leaf Cluster -->
    <path d="M 230,555 C 270,572 330,572 370,555 C 330,545 270,545 230,555 Z" fill="#008a40" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Central Black / Navy Circle -->
  <circle cx="300" cy="300" r="235" fill="#080c18" stroke="#ffffff" stroke-width="5" filter="url(#subtleGlow)"/>
  <circle cx="300" cy="300" r="226" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Circular Organization Name Arc -->
  <!-- Arc path from bottom left around top to bottom right -->
  <path id="orgArc" d="M 98,320 A 204,204 0 1,1 502,320" fill="none"/>
  
  <text fill="#ffffff" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="22" letter-spacing="3.8px">
    <textPath href="#orgArc" startOffset="50%" text-anchor="middle">
      ICONIC HUMAN RIGHTS &amp; EDUCATIONAL ORGANISATION
    </textPath>
  </text>

  <!-- 5 Gold/Orange Stars -->
  <!-- Center Star (Largest) -->
  <polygon points="300,96 308,120 332,120 313,134 320,158 300,144 280,158 287,134 268,120 292,120" fill="#f58220"/>
  <!-- Middle Left Star -->
  <polygon points="232,140 238,158 256,158 241,169 247,187 232,176 217,187 223,169 208,158 226,158" fill="#f58220"/>
  <!-- Middle Right Star -->
  <polygon points="368,140 374,158 392,158 377,169 383,187 368,176 353,187 359,169 344,158 362,158" fill="#f58220"/>
  <!-- Far Left Star (Smallest) -->
  <polygon points="178,204 182,216 196,216 185,224 189,237 178,229 167,237 171,224 160,216 174,216" fill="#f58220"/>
  <!-- Far Right Star (Smallest) -->
  <polygon points="422,204 426,216 440,216 429,224 433,237 422,229 411,237 415,224 404,216 418,216" fill="#f58220"/>

  <!-- Center Graphic: Graduation Cap (Mortarboard) -->
  <g fill="#ffffff">
    <!-- Cap Diamond Top -->
    <polygon points="300,174 410,222 300,270 190,222" />
    <!-- Cap Skull Base -->
    <path d="M 230,238 L 230,272 C 230,302 370,302 370,272 L 370,238 C 344,256 322,264 300,264 C 278,264 256,256 230,238 Z" />
    <!-- Tassel Button and String (Left side) -->
    <circle cx="300" cy="222" r="5.5" fill="#f0f0f0"/>
    <path d="M 300,222 Q 240,246 205,278" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Tassel Bell -->
    <path d="M 199,278 L 211,278 L 214,308 L 196,308 Z" fill="#ffffff"/>
    <circle cx="205" cy="280" r="4" fill="#dddddd"/>
  </g>

  <!-- Open Book & Human Figure with Raised Arms -->
  <g fill="#ffffff">
    <!-- Head of the figure -->
    <circle cx="300" cy="324" r="17"/>
    
    <!-- Raised Arms forming celebratory V shape -->
    <path d="M 300,348 C 286,330 255,318 218,328 C 250,350 274,374 286,400 C 293,382 297,364 300,348 Z"/>
    <path d="M 300,348 C 314,330 345,318 382,328 C 350,350 326,374 314,400 C 307,382 303,364 300,348 Z"/>

    <!-- Open Book Pages (Top Wings) -->
    <path d="M 300,412 C 262,388 206,376 160,402 C 198,426 250,438 300,458 C 350,438 402,426 440,402 C 394,376 338,388 300,412 Z"/>
    
    <!-- Open Book Pages (Middle Layer) -->
    <path d="M 300,448 C 268,426 218,416 180,436 C 218,458 262,468 300,484 C 338,468 382,458 420,436 C 382,416 332,426 300,448 Z"/>
  </g>

  <!-- Bold IHREO Text -->
  <text x="300" y="522" text-anchor="middle" fill="#ffffff" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="44" letter-spacing="5px">
    IHREO
  </text>

  <!-- Hindi Motto: सेवा परमो धर्मः (Indian Tricolor) -->
  <g font-family="'Noto Sans Devanagari', 'Mangal', 'Arial', sans-serif" font-weight="800" font-size="24" text-anchor="middle">
    <!-- Saffron: सेवा -->
    <text x="240" y="556" fill="#ff7700">सेवा</text>
    <!-- White: परमो -->
    <text x="300" y="556" fill="#ffffff">परमो</text>
    <!-- Green: धर्मः -->
    <text x="360" y="556" fill="#00a651">धर्मः</text>
  </g>
</svg>
