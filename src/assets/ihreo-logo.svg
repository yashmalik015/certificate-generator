<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Text Path -->
    <path id="textCircle" d="M 90,250 A 160,160 0 1,1 410,250 A 160,160 0 0,1 90,250" />
    <path id="topTextArc" d="M 68,250 A 182,182 0 1,1 432,250" />
    <path id="bottomTextArc" d="M 432,250 A 182,182 0 0,1 68,250" />
    
    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Laurel Wreath Background Left & Right -->
  <g fill="#009933" stroke="#007722" stroke-width="1.5">
    <!-- Left Laurel Wreath -->
    <!-- Lower leaves -->
    <path d="M 120,440 C 90,420 70,380 60,330 C 75,345 100,355 125,355 C 105,330 95,290 90,250 C 105,275 130,285 155,285 C 130,255 120,210 120,165 C 140,195 165,205 190,205 C 160,170 150,120 155,75 C 175,110 205,120 230,120 C 215,95 210,60 215,30 C 230,70 250,85 270,90" fill="none" stroke="#009933" stroke-width="6" />
    
    <!-- Individual stylized laurel leaves left -->
    <path d="M 130,445 C 80,420 50,360 45,300 C 65,325 100,335 125,330 C 95,300 70,250 70,190 C 95,220 130,230 155,225 C 125,185 105,130 120,75 C 145,115 180,125 205,120 C 185,85 185,45 200,15 C 220,55 240,75 250,80" fill="none" stroke="#009933" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Detailed Green Laurel Leaves Left -->
    <path d="M 195,30 C 160,50 145,95 155,135 C 135,100 135,65 150,40 Z" fill="#009933"/>
    <path d="M 150,75 C 115,105 105,150 120,195 C 100,155 105,120 120,95 Z" fill="#009933"/>
    <path d="M 115,140 C 75,175 65,225 80,270 C 65,230 70,190 90,160 Z" fill="#009933"/>
    <path d="M 80,215 C 45,255 40,310 60,355 C 45,310 50,270 70,240 Z" fill="#009933"/>
    <path d="M 60,295 C 35,340 35,395 65,435 C 45,395 50,350 70,320 Z" fill="#009933"/>
    <path d="M 65,375 C 55,420 70,465 115,490 C 85,465 80,425 90,395 Z" fill="#009933"/>
    <path d="M 115,445 C 125,475 155,495 195,498 C 160,490 140,470 135,450 Z" fill="#009933"/>

    <!-- Inner left leaf cluster -->
    <path d="M 190,80 C 165,110 160,145 175,175 C 155,145 155,115 170,95 Z" fill="#00aa33"/>
    <path d="M 155,140 C 130,175 125,215 140,245 C 120,215 120,180 135,160 Z" fill="#00aa33"/>
    <path d="M 125,210 C 100,245 95,290 110,320 C 90,290 95,255 105,230 Z" fill="#00aa33"/>
    <path d="M 105,280 C 85,320 85,365 105,395 C 85,365 85,330 95,305 Z" fill="#00aa33"/>
    <path d="M 105,355 C 95,395 110,435 145,455 C 120,435 115,400 120,375 Z" fill="#00aa33"/>

    <!-- Detailed Green Laurel Leaves Right -->
    <path d="M 305,30 C 340,50 355,95 345,135 C 365,100 365,65 350,40 Z" fill="#009933"/>
    <path d="M 350,75 C 385,105 395,150 380,195 C 400,155 395,120 380,95 Z" fill="#009933"/>
    <path d="M 385,140 C 425,175 435,225 420,270 C 435,230 430,190 410,160 Z" fill="#009933"/>
    <path d="M 420,215 C 455,255 460,310 440,355 C 455,310 450,270 430,240 Z" fill="#009933"/>
    <path d="M 440,295 C 465,340 465,395 435,435 C 455,395 450,350 430,320 Z" fill="#009933"/>
    <path d="M 435,375 C 445,420 430,465 385,490 C 415,465 420,425 410,395 Z" fill="#009933"/>
    <path d="M 385,445 C 375,475 345,495 305,498 C 340,490 360,470 365,450 Z" fill="#009933"/>

    <!-- Inner right leaf cluster -->
    <path d="M 310,80 C 335,110 340,145 325,175 C 345,145 345,115 330,95 Z" fill="#00aa33"/>
    <path d="M 345,140 C 370,175 375,215 360,245 C 380,215 380,180 365,160 Z" fill="#00aa33"/>
    <path d="M 375,210 C 400,245 405,290 390,320 C 410,290 405,255 395,230 Z" fill="#00aa33"/>
    <path d="M 395,280 C 415,320 415,365 395,395 C 415,365 415,330 405,305 Z" fill="#00aa33"/>
    <path d="M 395,355 C 405,395 390,435 355,455 C 380,435 385,400 380,375 Z" fill="#00aa33"/>
  </g>

  <!-- Central Black Circle -->
  <circle cx="250" cy="250" r="185" fill="#141414" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="176" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Circular Organization Name Text -->
  <path id="orgNameArc" d="M 85,250 A 165,165 0 1,1 415,250 A 165,165 0 0,1 85,250" fill="none"/>
  
  <text fill="#ffffff" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="18.5" letter-spacing="3.2px">
    <textPath href="#orgNameArc" startOffset="50%" text-anchor="middle">
      ICONIC HUMAN RIGHTS &amp; EDUCATIONAL ORGANISATION
    </textPath>
  </text>

  <!-- Five Gold/Orange Stars -->
  <!-- Center Star (Largest) -->
  <polygon points="250,90 256,108 274,108 260,119 265,136 250,125 235,136 240,119 226,108 244,108" fill="#f58220"/>
  <!-- Middle Left Star -->
  <polygon points="200,122 204,136 218,136 207,144 211,157 200,149 189,157 193,144 182,136 196,136" fill="#f58220"/>
  <!-- Middle Right Star -->
  <polygon points="300,122 304,136 318,136 307,144 311,157 300,149 289,157 293,144 282,136 296,136" fill="#f58220"/>
  <!-- Far Left Star -->
  <polygon points="160,170 163,180 174,180 165,186 168,196 160,190 152,196 155,186 146,180 157,180" fill="#f58220"/>
  <!-- Far Right Star -->
  <polygon points="340,170 343,180 354,180 345,186 348,196 340,190 332,196 335,186 326,180 337,180" fill="#f58220"/>

  <!-- Center Graphic: Graduation Cap (Mortarboard) -->
  <g fill="#ffffff">
    <!-- Cap Diamond Top -->
    <polygon points="250,148 335,185 250,222 165,185" />
    <!-- Cap Skull Base -->
    <path d="M 195,198 L 195,225 C 195,248 305,248 305,225 L 305,198 C 285,212 268,218 250,218 C 232,218 215,212 195,198 Z" />
    <!-- Tassel Button and String -->
    <circle cx="250" cy="185" r="4" fill="#dddddd"/>
    <path d="M 250,185 Q 200,205 175,230" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="171" y="230" width="7" height="22" rx="2" fill="#ffffff"/>
  </g>

  <!-- Open Book & Human Figure with Raised Arms -->
  <g fill="#ffffff">
    <!-- Head of the figure -->
    <circle cx="250" cy="265" r="14"/>
    
    <!-- Raised Arms forming a V shape / celebration -->
    <path d="M 250,285 C 240,270 215,260 185,268 C 210,285 230,305 240,325 C 245,310 248,295 250,285 Z"/>
    <path d="M 250,285 C 260,270 285,260 315,268 C 290,285 270,305 260,325 C 255,310 252,295 250,285 Z"/>

    <!-- Open Book Pages (Wings) Layer 1 -->
    <path d="M 250,335 C 220,315 175,305 140,325 C 170,345 210,355 250,370 C 290,355 330,345 360,325 C 325,305 280,315 250,335 Z"/>
    
    <!-- Open Book Pages (Wings) Layer 2 Bottom -->
    <path d="M 250,365 C 225,348 185,340 155,355 C 185,372 220,380 250,392 C 280,380 315,372 345,355 C 315,340 275,348 250,365 Z"/>
  </g>

  <!-- Bold IHREO Text -->
  <text x="250" y="420" text-anchor="middle" fill="#ffffff" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="4px">
    IHREO
  </text>

  <!-- Hindi Motto: सेवा परमो धर्मः (Tricolor colors) -->
  <g font-family="'Noto Sans Devanagari', 'Mangal', 'Arial', sans-serif" font-weight="800" font-size="19" text-anchor="middle">
    <!-- Saffron: सेवा -->
    <text x="202" y="445" fill="#FF9933">सेवा</text>
    <!-- White: परमो -->
    <text x="248" y="445" fill="#FFFFFF">परमो</text>
    <!-- Green: धर्मः -->
    <text x="296" y="445" fill="#138808">धर्मः</text>
  </g>
</svg>
